[project]
name = "automated-lead-gen"
version = "0.1.0"
description = ""
authors = [
    {name = "ShahabAthar25",email = "shahabathar25@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "asyncpraw (>=8.0.3,<9.0.0)",
    "toml (>=0.10.2,<0.11.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "feedparser (>=6.0.14,<7.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "pydantic-settings[toml] (>=2.15.0,<3.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "google-genai (>=2.20.0,<3.0.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
]

[tool.poetry]
packages = [{include = "reddit_lead_gen", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
